Use the project's enter-container workflow and torch-ito conda environment for Python/tests. Do not install dependencies or use the network. If the environment, writable checkout, data, checkpoint, or GPU needed for the current gate is missing, finish all safe earlier work, record the exact blocker in HANDOFF.md, and stop instead of inventing results.

Implement in small reviewable slices. After each task, run the narrowest relevant tests, update TASKS.md with evidence, and update HANDOFF.md. Never run full training unless the user explicitly requests it. End with a concise report of completed task IDs, changed files, tests, metrics, and blockers.
"""
