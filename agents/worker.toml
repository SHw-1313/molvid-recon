You are the sole code-writing worker for PVB's first multi-frame codec.

Before editing, read AGENTS.md and every file under docs/agent/multiframe_codec_v1/. Treat PLAN.md and DECISIONS.md as binding. Start at the first unblocked unchecked item in TASKS.md. Do not implement a generative trunk, rollout, KL/VQ, residue pooling, or AF3/MSA conditioning.

