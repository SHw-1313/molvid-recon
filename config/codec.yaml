schema_version: pvb.codec.config.v1

time:
  unit: ps
  continuous_scale_ps: 100.0
  buckets:
    - id: static
      center_ps: 0.0
      tolerance_ps: 0.0
      weight: 1.0
    - id: dt_80ps
      center_ps: 80.0
      tolerance_ps: 0.5
      weight: 1.0
    - id: dt_100ps
      center_ps: 100.0
      tolerance_ps: 0.5
      weight: 1.0
    - id: dt_1ns
      center_ps: 1000.0
      tolerance_ps: 5.0
      weight: 1.0
  normalization:
    min_count: 32
    epsilon: 1.0e-6

training:
  device: auto
  precision: fp32
  lr: 1.0e-4
  weight_decay: 1.0e-6
  max_steps: 1000
  warmup_steps: 100
  grad_clip: 1.0
  save_dir: ckpt/codec
  loss_weights:
    coordinate: 1.0
    local: 0.1
    bond: 0.1
    velocity: 0.1
    acceleration: 0.05
  loss_schedule:
    - start_step: 0
      weights:
        coordinate: 1.0
        local: 0.0
        bond: 0.0
        velocity: 0.0
        acceleration: 0.0
    - start_step: 100
      weights:
        coordinate: 1.0
        local: 0.1
        bond: 0.1
        velocity: 0.1
        acceleration: 0.05

model:
  hidden_channels: 128
  spatial_layers: 2
  temporal_layers: 1
  temporal_ratio: 1
  # Legacy is the unchanged default. State/detail T0 controls select one of
  # ratio1_state_detail, ratio2_state_detail, ratio4_state_detail, or
  # ratio4_matched_pooling explicitly in a phase-specific config/runner.
  temporal_codec_mode: legacy
  num_rbf: 50
  num_heads: 8
  spatial_backbone: torchmd_et
  lmax: 1
  vertex: true
  trainable_rbf: false
  vecnorm_type: null
  cutoff_lower: 0.0
  cutoff_upper: 5.0
  max_num_neighbors: 32
  neighbor_backend: cuda_radius
  use_spatial_refiner: false
  time_scale_ps: 100.0
  bond_construction:
    mode: topology
  spatial_execution:
    mode: full

data:
  train_roots: []
  valid_roots: []
  # Real ATLAS/MISATO clips reach 71,360 tokens in the pilot; larger clips are excluded by the sampler bound.
  max_tokens: 80000
  num_workers: 0
  pin_memory: false
  seed: 20260819
  checkpoint: null
