schema_version: molvid.codec.config.v1

time:
  unit: ps
  continuous_scale_ps: 100.0
  buckets:
    - {id: static, center_ps: 0.0, tolerance_ps: 0.0, weight: 1.0}
    - {id: dt_80ps, center_ps: 80.0, tolerance_ps: 0.5, weight: 1.0}
    - {id: dt_100ps, center_ps: 100.0, tolerance_ps: 0.5, weight: 1.0}
    - {id: dt_1ns, center_ps: 1000.0, tolerance_ps: 5.0, weight: 1.0}
  normalization: {min_count: 32, epsilon: 1.0e-6}

training:
  device: cuda
  precision: fp32
  lr: 1.0e-4
  weight_decay: 1.0e-6
  max_steps: 1000
  warmup_steps: 100
  grad_clip: 1.0
  save_dir: outputs/molvid_codec
  loss_schedule:
    - start_step: 0
      weights: {coordinate: 1.0, local: 0.0, bond: 0.0, velocity: 0.0, acceleration: 0.0}
    - start_step: 100
      weights: {coordinate: 1.0, local: 0.1, bond: 0.1, velocity: 0.1, acceleration: 0.05}

model:
  hidden_channels: 128
  spatial_layers: 2
  temporal_codec_mode: ratio4_state_detail
  num_rbf: 50
  num_heads: 8
  cutoff_lower: 0.0
  cutoff_upper: 5.0
  max_num_neighbors: 32
  bond_construction: {mode: topology}
  spatial_dtype: float32
  coordinate_stem: centered_vector

data:
  train_roots: []
  valid_roots: []
  max_tokens: 80000
  num_workers: 0
  pin_memory: false
  seed: 20260819
