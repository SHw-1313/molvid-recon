data:
  dataset: uni
  same_origin: false
  complexity: "n"
  # The current clip stores include complete complexes, so this bound keeps
  # the original dynamic batching path from silently dropping MISATO items
  # larger than the old 2,000-atom legacy bound.
  ubound_per_batch: 8000
  max_batches: 60000
  path:
    atlas_train: clip:///data4/users/sihao/data/pvb_cross_dataset_20260810/clips/atlas/dt_100ps/train
    atlas_valid: clip:///data4/users/sihao/data/pvb_cross_dataset_20260810/clips/atlas/dt_100ps/valid
    misato_train: clip:///data4/users/sihao/data/pvb_cross_dataset_20260810/clips/misato/dt_80ps/train
    misato_valid: clip:///data4/users/sihao/data/pvb_cross_dataset_20260810/clips/misato/dt_80ps/valid

training:
  lr: 0.00005
  loss_type: null
  warmup: 1000
  max_epoch: 1
  grad_clip: 1.0
  patience: 5
  save_topk: 10
  shuffle: true
  num_workers: 0
  batch_size: 1
  save_dir: /workspace/PVB/outputs/pvb_origin_baselines/static_retrain/checkpoints
  wrapper:
    ema:
      update_after_step: 1000000

model:
  ref: null
  ckpt: /data1/repo/PVB/ckpt/pdbbind_pretrain/version_1/checkpoint/epoch191_step113472.ckpt
  model_type: md
  hidden_dim: 256
  ffn_dim: 512
  rbf_dim: 32
  heads: 8
  layers: 8
  cutoff_lower: 0.0
  cutoff_upper: 10.0
  cutoff_H: 3.5
  k_neighbors: 32
  coord_prior_var: 0.5
  sigma: 0.2
  additional_noise_scale: 0.2
  kl_weight: 0.8
  re_weight: 1.0
  reward_weight: 100.0
  rl_sde_step: 10
  using_ode: false
  backbone: torchmdnet
